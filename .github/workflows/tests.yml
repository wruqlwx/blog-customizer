name: Tests

on:
  pull_request:
    branches:
      - main
      
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v3
    
    - uses: actions/setup-node@v3
      with:
        node-version: 20

    - name: Install Project Dependencies
      run: npm install

    - name: Get testing lib
      run: set -eu && git clone https://github.com/Yandex-Practicum/tests-blog-customizer.git /tmp/tests-blog-customizer

    - name: Install Browsers and Run Tests
      run: |
        export PLAYWRIGHT_BROWSERS_PATH=${{ github.workspace }}/pw-browsers
        
        cd /tmp/tests-blog-customizer
        npm install
        npx playwright install --with-deps chromium
        
        cd ${{ github.workspace }}
        bash /tmp/tests-blog-customizer/run.sh
      
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: report
        path: /tmp/tests-blog-customizer/tmp/artifacts
        retention-days: 30