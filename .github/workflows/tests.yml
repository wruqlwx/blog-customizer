name: Tests

on:
  pull_request:
    branches:
      - main
      
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: 20
    - name: Check if the repository is private
      if: ${{github.event.repository.private}}
      run: exit 1
    - name: Get testing lib
      run: set -eu && git clone https://github.com/Yandex-Practicum/tests-blog-customizer.git /tmp/tests-blog-customizer
    - name: Install Playwright browsers
      run: |
        cd /tmp/tests-blog-customizer
        npm ci
        sudo apt-get update
        sudo apt-get install -y \
          libnss3 \
          libnspr4 \
          libatk-bridge2.0-0 \
          libatk1.0-0 \
          libcups2 \
          libdrm2 \
          libxkbcommon0 \
          libxcomposite1 \
          libxdamage1 \
          libxfixes3 \
          libxrandr2 \
          libgbm1 \
          libasound2t64
        npx playwright install chromium
    - name: Run tests
      run: bash /tmp/tests-blog-customizer/run.sh
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: report
        path: /tmp/tests-blog-customizer/tmp/artifacts
        retention-days: 30